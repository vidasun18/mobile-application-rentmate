services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rentmate}
      POSTGRES_USER: ${POSTGRES_USER:-rentmate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup.ps1 or configure .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - rentmate_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-rentmate}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-rentmate}
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET in .env}
      PORT: 3000
      CLOUDINARY_URL: ${CLOUDINARY_URL:-}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    init: true
volumes:
  rentmate_data:
